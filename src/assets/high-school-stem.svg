    <g stroke-width="3">
      <path d="M104 108l58-34 58 34v68l-58 34-58-34z" />
      <path d="M162 74V42m58 66 42-25m-42 93 42 25m-100 9v39m-58-73-42 25m42-93-42-25" />
      <circle cx="162" cy="35" r="10" />
      <circle cx="272" cy="77" r="10" />
      <circle cx="272" cy="207" r="10" />
      <circle cx="162" cy="260" r="10" />
      <circle cx="51" cy="207" r="10" />
      <circle cx="51" cy="77" r="10" />
    </g>

    <!-- Coordinate plane and curve -->
    <g transform="translate(795 74)" stroke-width="2.5">
      <path d="M0 170h294M42 205V0" />
      <path d="M67 169c46-8 75-48 103-100 27 63 57 95 98 101" stroke-width="4" />
      <path d="M286 164l8 6-8 6M36 8l6-8 6 8" />
      <circle cx="170" cy="69" r="6" fill="#f472b6" stroke="none" />
      <text x="177" y="57" fill="#f0abfc" stroke="none" font-family="Arial, sans-serif" font-size="22">f(x)</text>
    </g>

    <!-- Lab flask -->
    <g transform="translate(80 475)" stroke-width="3">
