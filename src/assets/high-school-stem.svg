      <circle cx="93" cy="112" r="7" /><circle cx="142" cy="128" r="5" /><circle cx="155" cy="91" r="8" />
    </g>

    <!-- Geometry and theorem -->
    <g transform="translate(448 500)" stroke-width="3">
      <path d="M0 178L94 0l142 178H0z" />
      <path d="M0 178h30v-30" />
      <path d="M94 0v178" stroke-dasharray="8 10" />
      <text x="255" y="106" fill="#a5f3fc" stroke="none" font-family="Arial, sans-serif" font-size="31">a² + b² = c²</text>
      <text x="255" y="147" fill="#c4b5fd" stroke="none" font-family="Arial, sans-serif" font-size="22">evidence + context → judgment</text>
    </g>

