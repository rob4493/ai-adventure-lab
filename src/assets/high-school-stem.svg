      <ellipse cx="78" cy="78" rx="76" ry="29" transform="rotate(120 78 78)" />
      <circle cx="78" cy="78" r="11" fill="#f472b6" stroke="none" />
      <circle cx="151" cy="82" r="7" fill="#67e8f9" stroke="none" />
      <circle cx="30" cy="22" r="7" fill="#c084fc" stroke="none" />
      <circle cx="46" cy="139" r="7" fill="#6ee7b7" stroke="none" />
    </g>

