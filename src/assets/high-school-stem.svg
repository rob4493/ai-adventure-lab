    <g transform="translate(414 235)" stroke-width="3">
      <path d="M0 122l74-62 72 28 77-76 83 39" />
      <circle cx="0" cy="122" r="7" fill="#67e8f9" /><circle cx="74" cy="60" r="7" fill="#60a5fa" />
